# cargo-deny policy (KICKOFF §1). Run: cargo deny check
[graph]
all-features = false
# Only the platform we ship: Linux (the owner dropped Windows and macOS on
# 2026-10-10). Other targets pull crates that never reach our binary (e.g.
# webpki-root-certs, CDLA-Permissive-2.0, on Android; clipboard-win,
# BSL-1.0, on Windows). Widen this list, and re-check licenses, if a target
# is ever added.
targets = [
    "x86_64-unknown-linux-gnu",
]

[licenses]
# KICKOFF §1 allowlist, plus owner-approved exceptions:
# - bzip2-1.0.6 (2026-10-09, docs/DECODER_PLAN.md): every bzip2 decoder,
#   needed for Level II, carries it.
# (BSL-1.0 was approved on 2026-10-10 for eframe's Windows clipboard crates,
# then became unnecessary when Windows builds were dropped the same day.)
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "GPL-3.0-or-later",
    "bzip2-1.0.6",
]
confidence-threshold = 0.9
# OFL-1.1 covers bundled fonts, not crates, so it is never "encountered".
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # OpenSSL: KICKOFF §2 requires rustls.
    { crate = "openssl-sys" },
    # Carries license terms outside the allowlist; use rustls' ring provider.
    { crate = "aws-lc-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained notice, not a vulnerability; reached via glyphon ->
    # cosmic-text -> fontdb, and no maintained release exists yet. Drop this
    # once cosmic-text moves off ttf-parser.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; no upgrade path via cosmic-text yet" },
    # Unmaintained notices, not vulnerabilities (zbus issue #2043); reached via
    # eframe -> egui-winit -> accesskit (screen reader support), which pins
    # zbus 5. Drop these once accesskit moves on.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; pinned by accesskit (a11y) via eframe" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; pinned by accesskit (a11y) via eframe" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; pinned by accesskit (a11y) via eframe" },
]
