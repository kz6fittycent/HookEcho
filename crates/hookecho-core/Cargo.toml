[package]
name = "hookecho-core"
description = "Hook Echo core: radar decoding, sites, geometry, config (no UI, no GPU)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
nexrad-data.workspace = true
nexrad-model.workspace = true
serde.workspace = true
toml.workspace = true
directories.workspace = true
thiserror.workspace = true
# NWS alerts GeoJSON (alerts.rs).
serde_json.workspace = true
# SPC watch and MD KMZ files are deflated zips (spc.rs).
flate2.workspace = true
# Level III product symbology blocks (bzip2-1.0.6 exception, DECODER_PLAN).
bzip2 = "0.6.1"
# Async fetching (KICKOFF §2): tokio + reqwest with rustls (ring provider).
tokio = { version = "1.53", default-features = false, features = ["rt", "time", "sync", "macros"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
sha2.workspace = true
