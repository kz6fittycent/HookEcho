    "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "MPL-2.0", "OFL-1.1", "Unicode-3.0", "GPL-3.0-or-later", "bzip2-1.0.6",
