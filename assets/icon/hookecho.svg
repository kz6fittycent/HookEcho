<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Hook Echo app icon (original). A velocity couplet - the inbound
       (green) and outbound (red) Doppler velocities of a rotating storm -
       drawn as a swirl, inside an arrow turning counter-clockwise, the way
       Northern Hemisphere supercells rotate (green left, red right, seen
       from a radar to the south). GPL-3.0-or-later. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D2330"/>
      <stop offset="1" stop-color="#0E1117"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <g transform="translate(512 0) scale(-1 1)">
    <path d="M256 96 A160 160 0 1 1 106 310" fill="none" stroke="#8FA3BF" stroke-opacity="0.45"
          stroke-width="16" stroke-linecap="round"/>
    <path d="M86 278 L106 322 L138 286 Z" fill="#8FA3BF" fill-opacity="0.45"/>
  </g>
  <circle cx="256" cy="256" r="106" fill="#E2402E"/>
  <path d="M256 150 A106 106 0 0 0 256 362 A53 53 0 0 0 256 256 A53 53 0 0 1 256 150 Z" fill="#1FBF6A"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
